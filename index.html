<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bethel Computer Centre, Lunglei</title>
    <!-- SheetJS Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f0f2f5; min-height: 100vh; padding-bottom: 50px; }
        .hidden { display: none !important; }
        .hero-section { height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0c4a6e, #0284c7); color: white; text-align: center; position: absolute; top: 0; left: 0; z-index: 1000; width: 100%; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 5px; transition: 0.3s; }
        .btn-primary { background-color: #0284c7; color: white; }
        .btn-success { background-color: #16a34a; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-outline { background-color: transparent; border: 1px solid #0284c7; color: #0284c7; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #e2e8f0; text-align: left; }
        .notice-box { border-left: 5px solid #0284c7; background: #f9fafb; padding: 15px; margin-bottom: 15px; }
        .comment-section { margin-top: 10px; padding: 8px; background: #eee; font-size: 12px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- HOMEPAGE -->
    <section id="home-section" class="hero-section">
        <div class="hero-content">
            <h1>Bethel Computer Centre</h1>
            <div style="display:flex; flex-direction:column; gap:10px; max-width:300px; margin:0 auto;">
                <button class="btn btn-primary" onclick="showSection('student-registration-section')">Zirlai Registration</button>
                <button class="btn btn-success" onclick="showSection('student-login-section')">Zirlai Login</button>
                <button class="btn btn-outline" style="color:white; border-color:white;" onclick="showSection('admin-login-section')">Admin Login</button>
            </div>
        </div>
    </section>

    <div class="container">
        <!-- REGISTRATION -->
        <section id="student-registration-section" class="card hidden">
            <h2>Zirlai In-register-na</h2>
            <form onsubmit="registerStudent(event)">
                <input type="text" id="reg-enrollment" placeholder="Enrollment Number" required>
                <input type="text" id="reg-name" placeholder="Hming Puitling" required>
                <input type="text" id="reg-dob" placeholder="Date of Birth (DD-MM-YYYY)" required>
                <button type="submit" class="btn btn-primary">Register Rawh</button>
            </form>
            <button class="btn btn-outline" onclick="showSection('home-section')">Home</button>
        </section>

        <!-- LOGIN -->
        <section id="student-login-section" class="card hidden">
            <h2>Zirlai Login</h2>
            <form onsubmit="loginStudent(event)">
                <input type="text" id="login-enrollment" placeholder="Enrollment Number" required>
                <input type="text" id="login-dob" placeholder="Date of Birth (DD-MM-YYYY)" required>
                <button type="submit" class="btn btn-success">Lut rawh</button>
            </form>
            <button class="btn btn-outline" onclick="showSection('home-section')">Home</button>
        </section>

        <!-- ADMIN PANEL -->
        <section id="admin-login-section" class="card hidden">
            <h2>Admin Login</h2>
            <input type="password" id="admin-password" placeholder="Password">
            <button class="btn btn-primary" onclick="checkAdmin()">Lut rawh</button>
            <button class="btn btn-outline" onclick="showSection('home-section')">Home</button>
        </section>

        <!-- TEACHER DASHBOARD -->
        <section id="teacher-dashboard-section" class="hidden">
            <button class="btn btn-danger" onclick="showSection('home-section')">Log Out</button>
            <div class="card">
                <h3>Notice Board Siamna</h3>
                <input type="text" id="notice-title" placeholder="Title">
                <textarea id="notice-content" placeholder="Content..."></textarea>
                <button class="btn btn-primary" onclick="addNotice()">Post Notice</button>
            </div>
            <div class="card">
                <h3>Link Sem Chhuahna (PDF/GitHub/etc)</h3>
                <form onsubmit="shareLink(event)">
                    <select id="link-type"><option>PDF Note</option><option>GitHub Project</option><option>Google Form</option></select>
                    <input type="text" id="link-name" placeholder="Title" required>
                    <input type="url" id="link-url" placeholder="URL" required>
                    <button type="submit" class="btn btn-primary">Publish Link</button>
                </form>
            </div>
            <div class="card">
                <h3>Management (Delete buttons)</h3>
                <div id="admin-management-container"></div>
            </div>
            <button class="btn btn-success" onclick="exportToExcel()">Export Results</button>
        </section>

        <!-- STUDENT PORTAL -->
        <section id="student-portal-section" class="hidden">
            <h2 id="student-welcome-title">Zirlai Portal</h2>
            <div id="student-notice-list" class="card"><h3>Notice Board</h3></div>
            <div id="student-links-container" class="card"><h3>Thil Sem te</h3></div>
            <button class="btn btn-danger" onclick="showSection('home-section')">Log Out</button>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, orderBy, query, setDoc, getDocs, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAYardtj2WcBiUGSD9Ytqa0yZUWwjEXgis",
            authDomain: "bethel-portal-1641f.firebaseapp.com",
            projectId: "bethel-portal-1641f",
            storageBucket: "bethel-portal-1641f.firebasestorage.app",
            messagingSenderId: "985610423339",
            appId: "1:985610423339:web:f35bd205776bb962ed2e6e",
            measurementId: "G-JVY6SK2EL9"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.currentStudent = { enrollment: '', name: '' };

        window.showSection = (id) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        };

        // Notice Board
        window.addNotice = async () => {
            await addDoc(collection(db, "notices"), { title: document.getElementById('notice-title').value, content: document.getElementById('notice-content').value, createdAt: new Date() });
            alert("Notice Post!");
        };

        window.deleteNotice = async (id) => { await deleteDoc(doc(db, "notices", id)); };
        
        window.addComment = async (noticeId) => {
            const text = document.getElementById('comment-input-' + noticeId).value;
            await addDoc(collection(db, "notices", noticeId, "comments"), { student: window.currentStudent.name, text, createdAt: new Date() });
        };

        // Register/Login
        window.registerStudent = async (e) => {
            e.preventDefault();
            const eNo = document.getElementById('reg-enrollment').value;
            await setDoc(doc(db, "students", eNo), { enrollment: eNo, name: document.getElementById('reg-name').value, dob: document.getElementById('reg-dob').value });
            alert("Registered!"); showSection('home-section');
        };

        window.loginStudent = async (e) => {
            e.preventDefault();
            const snap = await getDocs(query(collection(db, "students"), where("enrollment", "==", document.getElementById('login-enrollment').value), where("dob", "==", document.getElementById('login-dob').value)));
            if(!snap.empty) { 
                snap.forEach(d => window.currentStudent.name = d.data().name);
                showSection('student-portal-section'); 
            } else alert("Details dik lo!");
        };

        window.checkAdmin = () => {
            if(document.getElementById('admin-password').value === "Bethel@123") showSection('teacher-dashboard-section');
        };

        window.shareLink = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "shared_links"), { type: document.getElementById('link-type').value, name: document.getElementById('link-name').value, url: document.getElementById('link-url').value, createdAt: new Date() });
            alert("Published!");
        };

        window.exportToExcel = async () => {
            const snap = await getDocs(collection(db, "student_results"));
            let data = [];
            snap.forEach(d => data.push(d.data()));
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Marks");
            XLSX.writeFile(wb, "Marks.xlsx");
        };

        // Real-time Listeners
        onSnapshot(collection(db, "notices"), (snap) => {
            const adminList = document.getElementById('admin-notice-list');
            const studentList = document.getElementById('student-notice-list');
            studentList.innerHTML = '<h3>Notice Board</h3>';
            snap.forEach(d => {
                const n = d.data();
                studentList.innerHTML += `<div class="notice-box"><b>${n.title}</b><p>${n.content}</p>
                <input type="text" id="comment-input-${d.id}" placeholder="Comment...">
                <button class="btn btn-success" onclick="addComment('${d.id}')">Comment</button></div>`;
            });
        });

        onSnapshot(query(collection(db, "shared_links")), snap => {
            const sCon = document.getElementById('student-links-container');
            sCon.innerHTML = '<h3>Thil Sem te</h3>';
            snap.forEach(d => {
                const l = d.data();
                sCon.innerHTML += `<div class="card"><b>${l.name}</b> <a href="${l.url}" target="_blank" class="btn btn-primary">Hawng</a></div>`;
            });
        });
    </script>
</body>
</html>
